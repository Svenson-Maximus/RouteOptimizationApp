spring.application.name=customer-master-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/FocusProject2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fp2}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fp2_dev_password}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:missing

management.endpoints.web.exposure.include=health,info

google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.routes.chunk-size=${GOOGLE_ROUTES_CHUNK_SIZE:10}
google.routes.matrix-endpoint=${GOOGLE_ROUTES_MATRIX_ENDPOINT:https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix}
google.routes.routing-preference=${GOOGLE_ROUTES_ROUTING_PREFERENCE:TRAFFIC_UNAWARE}
google.routes.elements-per-minute-limit=${GOOGLE_ROUTES_ELEMENTS_PER_MINUTE_LIMIT:2900}

optimizer.python-executable=${OPTIMIZER_PYTHON_EXECUTABLE:../../../.conda/envs/route-optimizer/python.exe}
optimizer.solver-script=${OPTIMIZER_SOLVER_SCRIPT:../../optimizer/route-optimization-engine/src/main.py}
optimizer.database-url=${OPTIMIZER_DATABASE_URL:postgresql://fp2:fp2_dev_password@localhost:5432/FocusProject2}
optimizer.process-timeout-seconds=${OPTIMIZER_PROCESS_TIMEOUT_SECONDS:120}
