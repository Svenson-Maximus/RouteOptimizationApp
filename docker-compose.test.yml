services:
  postgres-test:
    image: postgres:16
    container_name: fp2-postgres-test
    environment:
      POSTGRES_DB: FocusProject2Test
      POSTGRES_USER: fp2_test
      POSTGRES_PASSWORD: fp2_test_password
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp2_test -d FocusProject2Test"]
      interval: 5s
      timeout: 5s
      retries: 10
