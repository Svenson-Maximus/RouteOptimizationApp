name: FP2 test pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/address-validation-ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend build
        working-directory: apps/frontend/address-validation-ui
        run: |
          npm ci
          npm run build

      - name: Java tests
        working-directory: apps/services/customer-master-service
        run: ./gradlew test

      - name: Python syntax check
        run: python -m py_compile apps/optimizer/route-optimization-engine/src/main.py

  integration:
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d postgres-test

      - name: Show database status
        run: docker compose -f docker-compose.test.yml ps
